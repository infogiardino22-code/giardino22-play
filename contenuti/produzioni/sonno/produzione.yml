nome: SONNO
categoria: Salute e benessere          # piccola etichetta verde sopra il titolo
ordine: 1                              # posizione del carosello in home (1 = primo)
attivo: true                           # false = format nascosto ovunque
original: true               # etichetta "G22 Original" sulle card

descrizione: >
  Ciò che sei di giorno comincia la notte. La serie di Giardino22 Play dedicata
  al sonno e al benessere: con il Dott. Camillo Foresti e Donatello Iacullo
  affrontiamo i temi della medicina del sonno con un linguaggio semplice,
  autorevole e accessibile.

